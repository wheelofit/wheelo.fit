name: Build Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run Lint
        run: npm run lint
        continue-on-error: true # Still won't fail the PR if lint fails

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Create dummy .env file
        run: |
          echo 'DATABASE_URL="mongodb://localhost:27017/dummy"' >> .env
          echo 'JWT_SECRET="dummy"' >> .env
          echo 'CLOUDINARY_API_KEY="dummy"' >> .env
          echo 'CLOUDINARY_API_SECRET="dummy"' >> .env
          echo 'CLOUDINARY_CLOUD_NAME="dummy"' >> .env
          echo 'INSTAGRAM_SYNC_SECRET="dummy"' >> .env
          echo 'PHONEPE_CLIENT_ID="dummy"' >> .env
          echo 'PHONEPE_CLIENT_SECRET="dummy"' >> .env
          echo 'PHONEPE_CLIENT_VERSION="1"' >> .env
          echo 'PHONEPE_ENV="SANDBOX"' >> .env
          echo 'GMAIL_USER="dummy@gmail.com"' >> .env
          echo 'GMAIL_APP_PASSWORD="dummy"' >> .env
          echo 'NEXT_PUBLIC_ENCRYPTION_KEY="dummy"' >> .env
      - name: Run Build
        run: npm run build
