name: Build Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # You can change this to match your project's node version
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci # Uses npm ci for clean, reliable installs based on package-lock.json. Use npm install if you don't have a package-lock.json

    - name: Run Lint
      run: npm run lint
      
    - name: Run Build
      run: npm run build
