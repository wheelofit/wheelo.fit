name: Build Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Format Code
        run: npm run format
      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code"
      - name: Run Lint
        run: npm run lint

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Create dummy .env file
        run: |
          echo 'DATABASE_URL="mongodb://localhost:27017/dummy"' >> .env
          echo 'JWT_SECRET="dummy"' >> .env
          echo 'CLOUDINARY_API_KEY="dummy"' >> .env
          echo 'CLOUDINARY_API_SECRET="dummy"' >> .env
          echo 'CLOUDINARY_CLOUD_NAME="dummy"' >> .env
          echo 'INSTAGRAM_SYNC_SECRET="dummy"' >> .env
          echo 'PHONEPE_CLIENT_ID="dummy"' >> .env
          echo 'PHONEPE_CLIENT_SECRET="dummy"' >> .env
          echo 'PHONEPE_CLIENT_VERSION="1"' >> .env
          echo 'PHONEPE_ENV="SANDBOX"' >> .env
          echo 'GMAIL_USER="dummy@gmail.com"' >> .env
          echo 'GMAIL_APP_PASSWORD="dummy"' >> .env
          echo 'NEXT_PUBLIC_ENCRYPTION_KEY="dummy"' >> .env
      - name: Run Build
        run: npm run build
